name: Flutter CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure MSVC (Workaround)
        run: echo "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress Windows Artifact
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Release.zip
        shell: powershell

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Release.zip

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Get Dependencies
        run: flutter pub get

      # --no-codesign 参数用于在没有签名证书的情况下生成构建产物
      - name: Build IOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Compress iOS Artifact
        # 将生成的 app 包压缩，方便上传
        run: zip -r ios-build.zip build/ios/iphoneos/Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-zip
          path: ios-build.zip

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Compress Web Artifact
        run: zip -r web-build.zip build/web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: web-build.zip

  release:
    needs: [build-android, build-ios, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read pubspec version
        id: vars
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "VERSION=$VERSION" >>$GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.VERSION }}
          overwrite_files: true
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/ios-zip/ios-build.zip
            artifacts/windows-zip/Release.zip
            artifacts/web-zip/web-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Server
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          REPO="${{ github.repository }}"
          
          # 拼接所有平台的下载链接
          ANDROID_URL="https://github.com/$REPO/releases/download/$VERSION/app-release.apk"
          IOS_URL="https://github.com/$REPO/releases/download/$VERSION/ios-build.zip"
          WINDOWS_URL="https://github.com/$REPO/releases/download/$VERSION/Release.zip"
          WEB_URL="https://github.com/$REPO/releases/download/$VERSION/web-build.zip"

          echo "Notifying server for version $VERSION..."

          curl -X POST https://www.yuumi.cc/webhook/deploy \
          -H "Content-Type: application/json" \
          -d "{
            \"status\": \"success\",
            \"version\": \"$VERSION\",
            \"android_url\": \"$ANDROID_URL\",
            \"ios_url\": \"$IOS_URL\",
            \"windows_url\": \"$WINDOWS_URL\",
            \"web_url\": \"$WEB_URL\"
          }"